# A perceptual motion engine for scrolling, built against a vendored copy of
# bite-gpui. See README.md for the layout and how to run it.
[package]
name = "cool_scroll"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "Five candidate ways of making fast scrolling feel like less of a fight."
authors = ["Vanuan"]

[workspace]
resolver = "3"
# The fork is a dependency, not part of this workspace: it keeps its own root
# manifest, lockfile and toolchain pin.
exclude = ["bite-gpui"]

[lints.clippy]
# The denials bite-gpui applies to its own crates.
dbg_macro = "deny"
todo = "deny"

[features]
# The headless platform, and the paint introspection the view's tests are written
# against. Opt-in, the way the text system's own crate opts in.
#
# Declared as a feature rather than left in `[dev-dependencies]`, because Cargo
# unifies a dev-dependency's features into every dev-context build — `cargo
# test`, `cargo build --all-targets`, and any workspace member's example built
# alongside them. `test-support` moves gpui's frame drawing onto its test path,
# which draws every dirty window at the end of every `App::update` instead of
# leaving frames to the platform, so a build that is not running tests should
# not be able to pick it up by accident. The tests that need it are the ones in
# `src/main.rs`, which is why they take `--features test-support` to run at all;
# `src/document.rs` and `src/motion.rs` need no window and run either way.
test-support = ["bite-gpui/test-support"]

[dependencies]
# Repointed at the published crates: no checkout, no branch, no revision. That is
# the point of this app — it is a real consumer of the artefact the rearchitecture
# publishes, rather than of the fork it was written against.
#
# Was: `gpui = { path = "bite-gpui/crates/gpui", default-features = false,
# features = ["platform"] }` against a checkout of
# bite_v1.21.0-pre-path-pass-cost at 33d8929.
bite-gpui = { version = "1.21", default-features = false, features = ["platform"] }
# Resolved to patches/gpui_animotion by [patch.crates-io].
gpui_animotion = "0.7.0"
# What shapes the document's text. It is a second implementation of the SPI rather
# than a layer of the stack, so it is neither vendored here nor published by the
# layer stack any more — it has a repository of its own and publishes to crates.io
# from there. The package is `bite-gp-parley` and the library is `gpui_parley`;
# cargo exposes a dependency under its library name, so `use gpui_parley::…` in
# `src/` is unchanged and no `package` rename is needed. `1.21.1` is the first
# release from that repository and the first with the hinting-instance cache and
# the host font database.
#
# Depended on with no features, so its own `test-support` — which activates its
# `gpui` dependency and puts gpui on the test draw path — never reaches a build of
# this app. Its own tests and examples are run in its repository:
#
#     cargo test --features test-support     # in bite-gpui/gpui_parley
#     cargo run --release --example raster_cost
#
bite-gp-parley = "1.21"

# The two patches this app owns, rather than ones mirrored from the fork: a shim
# that resolves the published `gpui-unofficial` to this fork's `gpui`, and
# `gpui_animotion` with one `Element` signature adapted. Neither is published, so
# both are local copies under `patches/`.
#
# `calloop` and `async-task` used to be here as well, mirrored from the fork's own
# root manifest, which patches them to revisions it locks. The published crates
# declare registry versions of both (cargo strips a `[patch]` before packaging), so
# a consumer of the crates needs neither.
[patch.crates-io]
gpui-unofficial = { path = "patches/gpui_unofficial" }
gpui_animotion = { path = "patches/gpui_animotion" }
